name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit, simulation, save and build tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Mobile touch end-to-end test
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:4173/kingdom-of-nobodies/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/kingdom-of-nobodies/ > /dev/null || (cat preview.log; exit 1)
          npm run test:e2e

  longevity:
    # Routine multigenerational stress test: 100 in-game years per seed, ending as the
    # Industrial Awakening opens, every invariant checked each decade. The full 500-year
    # run is the release check (see longevity-release.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: 100-year headless stress test
        run: node tests/longevity.mjs 100 ${{ matrix.seed }}

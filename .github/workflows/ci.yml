name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit, simulation, save and build tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Mobile touch end-to-end test
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:4173/kingdom-of-nobodies/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/kingdom-of-nobodies/ > /dev/null || (cat preview.log; exit 1)
          npm run test:e2e

  longevity:
    # Multigenerational stress test: 500 in-game years (all five civilization ages) across four seeds,
    # every invariant checked each decade and a save/reload checked at each new age.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: 500-year headless stress test
        run: npm run test:longevity -- 500 ${{ matrix.seed }}
